<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Blob 一致性 spike</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; background: #0d1b16; color: #e8e3d5;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #8fa396; font-size: 12px; margin-bottom: 18px; }
  .card { background: #14291f; border: 1px solid #234034; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: #8fa396; margin-bottom: 4px; }
  input[type=text] {
    width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #2f5245;
    background: #0f2118; color: #e8e3d5; font: inherit;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button {
    padding: 9px 14px; border-radius: 6px; border: 1px solid #2f5245; background: #1d3a2d;
    color: #e8e3d5; font: inherit; cursor: pointer;
  }
  button:hover { background: #26493a; }
  button.primary { background: #2f7d55; border-color: #3d9c6b; }
  button.primary:hover { background: #389163; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-variant-numeric: tabular-nums; }
  .kv dt { color: #8fa396; }
  .kv dd { margin: 0; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; }
  .ok { background: #1f5c3c; color: #9be8b8; }
  .bad { background: #6b2a2a; color: #f3b3b3; }
  .warn { background: #6b5620; color: #f0d99a; }
  #log {
    background: #0b1712; border: 1px solid #234034; border-radius: 8px; padding: 10px;
    height: 260px; overflow: auto; font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-break: break-all;
  }
  #log div { border-bottom: 1px solid #16291f; padding: 2px 0; }
  .muted { color: #7b8f84; }
  .hint { font-size: 12px; color: #8fa396; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Blob 一致性 spike</h1>
  <div class="sub">验证 EdgeOne Pages Blob 强一致读是否立即可见。需部署后访问（本地 dev 无云函数）。</div>

  <div class="card">
    <label for="room">房间码（两台设备填一样的）</label>
    <input id="room" type="text" value="demo" />
    <div class="row">
      <button id="read">读一次</button>
      <button id="inc" class="primary">+1（乐观锁）</button>
      <button id="poll">开始自动轮询 1s</button>
      <button id="clear">清空日志</button>
    </div>
    <div class="hint">本机 ID：<span id="me" class="muted">—</span></div>
  </div>

  <div class="card">
    <dl class="kv">
      <dt>version / n</dt><dd><b id="ver">—</b> / <b id="n">—</b></dd>
      <dt>最后写入者</dt><dd id="writer">—</dd>
      <dt>strong 读耗时</dt><dd id="msStrong">—</dd>
      <dt>eventual 读耗时</dt><dd id="msEventual">—</dd>
      <dt>两者结果一致</dt><dd id="same">—</dd>
      <dt>命中的 SDK 包</dt><dd id="sdk">—</dd>
    </dl>
  </div>

  <div class="card">
    <div style="margin-bottom:8px">日志</div>
    <div id="log"></div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const API = '/api/spike';

  let me = localStorage.getItem('spike.me');
  if (!me) { me = 'u' + Math.random().toString(36).slice(2, 8); localStorage.setItem('spike.me', me); }
  $('me').textContent = me;

  let lastVersion = null;
  let polling = false;
  let timer = null;
  let t0Sent = 0;

  const log = (msg, cls) => {
    const el = document.createElement('div');
    const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    el.textContent = `[${t}] ${msg}`;
    if (cls) el.innerHTML = `[${t}] <span class="${cls}">${msg}</span>`;
    $('log').appendChild(el);
    $('log').scrollTop = $('log').scrollHeight;
  };

  const room = () => encodeURIComponent(($('room').value || 'demo').trim());

  function render(d) {
    const s = (d.strong && d.strong.state) || null;
    $('ver').textContent = s ? s.version : '—';
    $('n').textContent = s ? s.n : '—';
    $('writer').textContent = s ? s.lastWriter : '—';
    $('msStrong').textContent = d.strong ? d.strong.ms + ' ms' : '—';
    $('msEventual').textContent = d.eventual ? d.eventual.ms + ' ms' : '—';
    const badge = (text, cls) => `<span class="badge ${cls}">${text}</span>`;
    if (d.same === true) $('same').innerHTML = badge('一致', 'ok');
    else if (d.same === false) $('same').innerHTML = badge('不一致 → 边缘缓存未刷新', 'bad');
    else $('same').textContent = '—';
    $('sdk').textContent = d.sdkName || '—';

    if (s && lastVersion !== null && s.version !== lastVersion) {
      const lag = Date.now() - s.updatedAt;
      log(`检测到更新 v${lastVersion} → v${s.version}，来自 ${s.lastWriter}，服务端 updatedAt 距今 ${lag} ms（含客户端时钟偏差）`, 'ok');
    }
    lastVersion = s ? s.version : null;
  }

  async function doRead(silent) {
    t0Sent = Date.now();
    try {
      const r = await fetch(`${API}?room=${room()}`, { cache: 'no-store' });
      const d = await r.json();
      if (!d.ok) { log('读取失败：' + d.reason, 'bad'); return; }
      render(d);
      if (!silent) log(`读：strong ${d.strong.ms}ms / eventual ${d.eventual.ms}ms，same=${d.same}`);
      return d;
    } catch (e) {
      log('请求异常：' + e, 'bad');
    }
  }

  async function doInc() {
    const cur = lastVersion;
    try {
      const r = await fetch(`${API}?room=${room()}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ writerId: me, expectVersion: cur }),
      });
      const d = await r.json();
      if (!d.ok) { log('写入失败：' + d.reason, 'bad'); return; }
      if (d.op === 'conflict') {
        log(`乐观锁冲突：期望 v${d.expected}，实际 v${d.state.version} → 重试`, 'warn');
        lastVersion = d.state.version;
        return doInc();
      }
      log(`写成功：op=${d.op} readMs=${d.readMs} writeMs=${d.writeMs} → v${d.state.version}`, 'ok');
      lastVersion = d.state.version;
      await doRead(true);
    } catch (e) {
      log('请求异常：' + e, 'bad');
    }
  }

  $('read').onclick = () => doRead(false);
  $('inc').onclick = () => doInc();
  $('clear').onclick = () => { $('log').innerHTML = ''; };
  $('poll').onclick = () => {
    polling = !polling;
    $('poll').textContent = polling ? '停止自动轮询' : '开始自动轮询 1s';
    if (polling) {
      timer = setInterval(() => doRead(true), 1000);
      log('开始自动轮询（1s）');
    } else {
      clearInterval(timer);
      log('停止自动轮询');
    }
  };

  log(`本机 ID = ${me}。请在两台设备打开本页并填相同房间码，一端点 +1，看另一端多久同步。`);
  doRead(false);
})();
</script>
</body>
</html>
